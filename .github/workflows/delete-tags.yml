name: Bulk Delete All Tags Fast
on:
  workflow_dispatch:

jobs:
  delete-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mass Wipe Remote Tags
        run: |
          # 1. Fetch every single tag name into a single line separated by spaces
          TAGS_LIST=$(git tag -l)
          
          if [ -z "$TAGS_LIST" ]; then
            echo "No tags found to delete."
            exit 0
          fi
          
          # 2. Push the deletion for ALL tags inside a single network request
          echo "Deleting all tags in a single batch push..."
          git push origin --delete $TAGS_LIST
